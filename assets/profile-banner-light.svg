<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">from prototype to production</title>
  <desc id="desc">A sketched forward arrow resolves once into a finished mark. Reduced-motion preferences receive the finished mark immediately.</desc>
  <style>
    .guide { opacity: 0; }
    .mark { stroke-dasharray: 1; stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .guide { animation: guide-out 1.45s ease-out both; }
      .mark { animation: finish 1.45s ease-out both; }
    }
    @keyframes guide-out {
      0%, 30% { opacity: .42; }
      70%, 100% { opacity: 0; }
    }
    @keyframes finish {
      0%, 15% { stroke-dashoffset: 1; fill-opacity: 0; stroke-opacity: 0; }
      25% { stroke-opacity: 1; }
      70% { stroke-dashoffset: 0; fill-opacity: 0; stroke-opacity: 1; }
      100% { stroke-dashoffset: 0; fill-opacity: 1; stroke-opacity: 1; }
    }
  </style>
  <path class="guide" d="M169 115 215 116 214 99 243 121 214 143 215 127 169 126Z" fill="none" stroke="#0969da" stroke-width="2.5" stroke-dasharray="3 4" stroke-linejoin="round"/>
  <path class="mark" pathLength="1" d="M169 116H215V101L242 121L215 141V126H169Z" fill="#8250df" stroke="#8250df" stroke-width="1.5" stroke-linejoin="round"/>
  <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <tspan x="299" y="94" fill="#57606a" font-size="40" font-weight="500">from prototype</tspan>
    <tspan x="299" y="170" fill="#1f2328" font-size="64" font-weight="800" font-style="italic">to production</tspan>
  </text>
</svg>
